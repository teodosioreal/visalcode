# Temporário: mostra como o instalador Calamares vem configurado no Debian 13.
name: PC Leve - sonda do instalador

on:
  push:
    paths:
      - ".github/workflows/pc-leve-sonda.yml"

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Ver arquivos do Calamares no Debian 13
        run: |
          sudo docker run --rm debian:trixie bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq --no-install-recommends calamares-settings-debian >/dev/null 2>&1
            echo "=== DEPENDS ==="; apt-cache depends calamares-settings-debian calamares | grep -E "Depends|Recommends"
            echo "=== ARQUIVOS ==="; dpkg -L calamares-settings-debian
            for f in /usr/share/calamares/helpers/* /usr/lib/calamares/modules/bootloader-config/module.desc /usr/lib/calamares/modules/sources-media/module.desc /usr/share/calamares/modules/partition.conf /usr/share/calamares/modules/grubcfg.conf /usr/share/calamares/modules/displaymanager.conf /usr/bin/add-calamares-desktop-icon /usr/bin/calamares-install-debian; do
              [ -f "$f" ] && { echo "===== $f"; grep -v "^ *#" "$f" | grep -v "^ *$"; }
            done
            ls /usr/share/calamares/modules/ | head -80
          '
